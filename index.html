<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dynamic Animated Webpage</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Interactive Animation Demo</h1>
    <div id="ball" class="ball"></div>

    <button onclick="triggerAnimation()">Bounce!</button>
    <button onclick="toggleTheme()">Toggle Theme</button>

    <p>You have triggered the animation <span id="count">0</span> times.</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
